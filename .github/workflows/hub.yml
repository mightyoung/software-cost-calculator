name: supplier-hub

on:
  push:
    branches: [main, codex-backend, 'codex/**']
    paths: ['services/supplier_hub/**', 'packages/supplier_core/lib/src/hub.dart', 'packages/supplier_core/tool/hub_export.dart', 'packages/supplier_core/test/hub_*_test.dart', 'apps/supplier_app/lib/features/hub/**', '.github/workflows/hub.yml']
  pull_request:
    paths: ['services/supplier_hub/**', 'packages/supplier_core/lib/src/hub.dart', 'packages/supplier_core/tool/hub_export.dart', 'packages/supplier_core/test/hub_*_test.dart', 'apps/supplier_app/lib/features/hub/**', '.github/workflows/hub.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: services/supplier_hub
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --component clippy,rustfmt
      - run: cargo +1.93.1 fmt --check
      - run: cargo +1.93.1 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.93.1 test --locked
      - run: cargo +1.93.1 build --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Admin frontend checks
        run: |
          node --check web/app.js
          node --experimental-default-type=module --test web/app.test.mjs
      - uses: subosito/flutter-action@v2
        if: runner.os == 'Linux'
        with:
          channel: stable
      - name: Dart publication contract
        if: runner.os == 'Linux'
        working-directory: packages/supplier_core
        run: |
          dart pub get
          dart analyze lib/src/hub.dart tool/hub_export.dart test/hub_export_test.dart test/hub_client_test.dart
          HUB_EXPORT_FIXTURE="${RUNNER_TEMP}/hub-quote.json" dart test test/hub_export_test.dart
          # Client against the hub binary built above.
          dart test test/hub_client_test.dart
      - name: Two-process smoke
        if: runner.os == 'Linux'
        run: python3 tool/smoke_test.py target/debug/supplier-hub --quote-json "${RUNNER_TEMP}/hub-quote.json"
