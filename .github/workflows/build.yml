name: build

on:
  push:
    branches: [main, 'claude/**']
    paths-ignore: ['**/*.md', '.impeccable.md']
  pull_request:
    paths-ignore: ['**/*.md', '.impeccable.md']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/design/g6/package-lock.json
      - name: Offline ontology graph tests and packaged asset consistency
        working-directory: docs/design/g6
        run: |
          npm ci --ignore-scripts
          npm test
          npm run check
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Core tests
        working-directory: packages/supplier_core
        run: |
          dart pub get
          dart analyze
          dart test
      - name: Core benchmark (size, exchange time and search gates)
        working-directory: packages/supplier_core
        # dart run, not compile exe: it bundles the SQLite build hook's library.
        run: |
          set -o pipefail
          dart run tool/bench.dart | tee -a "$GITHUB_STEP_SUMMARY"
      - name: App analyze and widget tests
        working-directory: apps/supplier_app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: NuGet/setup-nuget@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build
        working-directory: apps/supplier_app
        run: flutter build windows --release --dart-define=APP_VERSION=1.0.${{ github.run_number }}
      - name: Build MCP server (read-only access for AI tools)
        working-directory: packages/supplier_core
        run: |
          dart pub get
          dart build cli -t bin/siq_mcp.dart -o build/mcp
      - name: Package
        shell: pwsh
        run: |
          Copy-Item -Recurse packages/supplier_core/build/mcp/bundle apps/supplier_app/build/windows/x64/runner/Release/siq-mcp
          Compress-Archive -Path apps/supplier_app/build/windows/x64/runner/Release/* -DestinationPath supplier-app-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: supplier-app-windows
          path: supplier-app-windows.zip

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build
        working-directory: apps/supplier_app
        run: flutter build apk --release --dart-define=APP_VERSION=1.0.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: supplier-app-android
          path: apps/supplier_app/build/app/outputs/flutter-apk/app-release.apk

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build
        working-directory: apps/supplier_app
        run: flutter build macos --release --dart-define=APP_VERSION=1.0.${{ github.run_number }}
      - name: Build MCP server (read-only access for AI tools)
        working-directory: packages/supplier_core
        run: |
          dart pub get
          dart build cli -t bin/siq_mcp.dart -o build/mcp
      - name: Package
        run: |
          app=apps/supplier_app/build/macos/Build/Products/Release/supplier_app.app
          cp -R packages/supplier_core/build/mcp/bundle "$app/Contents/Resources/siq-mcp"
          # Adding files breaks the seal: re-sign, keeping the sandbox
          # entitlements, and fail the build if either is off.
          codesign --force --sign - --preserve-metadata=entitlements,requirements,flags,runtime "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements - "$app" 2>&1 | grep -q app-sandbox
          "$app/Contents/Resources/siq-mcp/bin/siq_mcp" --version
          # Finder shows the bundle's file name: ship it as 询价台账.app.
          mv "$app" "$(dirname "$app")/询价台账.app"
          ditto -c -k --keepParent "$(dirname "$app")/询价台账.app" supplier-app-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: supplier-app-macos
          path: supplier-app-macos.zip
