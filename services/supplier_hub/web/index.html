<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>公司资料中心 · 询价台账</title>
  <link rel="stylesheet" href="/admin/styles.css">
  <script type="module" src="/admin/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到内容</a>
  <aside class="sidebar" aria-label="主导航">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>询价台账<small>公司资料中心</small></span></div>
    <nav>
      <p class="nav-group">共享资料</p>
      <button data-page="home" aria-current="page"><svg class="icon" data-icon="workspace" viewBox="0 0 24 24" aria-hidden="true"><path d="M 4 4 L 20 4 L 20 20 L 4 20 Z M 4 10 L 20 10 M 10 10 L 10 20"/></svg>工作台</button>
      <button data-page="suppliers"><svg class="icon" data-icon="supplier" viewBox="0 0 24 24" aria-hidden="true"><path d="M 4 21 L 4 6 L 14 3 L 14 21 M 14 10 L 20 10 L 20 21 M 2 21 L 22 21 M 8 8 L 10 8 M 8 12 L 10 12 M 8 16 L 10 16 M 17 14 L 17 17"/></svg>供应商</button>
      <button data-page="quotes"><svg class="icon" data-icon="quotation" viewBox="0 0 24 24" aria-hidden="true"><path d="M 5 3 L 16 3 L 20 7 L 20 21 L 5 21 Z M 15 3 L 15 8 L 20 8 M 8 11 L 11 14 L 14 11 M 11 14 L 11 18 M 8 16 L 14 16"/></svg>历史报价</button>
      <button data-page="publish"><svg class="icon" data-icon="upload" viewBox="0 0 24 24" aria-hidden="true"><path d="M 12 16 L 12 3 M 7 8 L 12 3 L 17 8 M 4 16 L 4 21 L 20 21 L 20 16"/></svg>发布资料</button>
      <p class="nav-group">中心管理</p>
      <button data-page="sync"><svg class="icon" data-icon="exchange" viewBox="0 0 24 24" aria-hidden="true"><path d="M 3 7 L 20 7 M 16 3 L 20 7 L 16 11 M 21 17 L 4 17 M 8 13 L 4 17 L 8 21"/></svg>同步与交换</button>
      <button data-page="settings"><svg class="icon" data-icon="settings" viewBox="0 0 24 24" aria-hidden="true"><path d="M 4 6 L 8 6 M 12 6 L 20 6 M 4 12 L 14 12 M 18 12 L 20 12 M 4 18 L 6 18 M 10 18 L 20 18 M 8 4 L 12 4 L 12 8 L 8 8 Z M 14 10 L 18 10 L 18 14 L 14 14 Z M 6 16 L 10 16 L 10 20 L 6 20 Z"/></svg>服务设置</button>
    </nav>
    <div class="sidebar-footer"><span class="status-dot" aria-hidden="true"></span><span id="connection-state">正在连接</span><small>本地工作 · 按需共享</small></div>
  </aside>
  <div class="workspace">
    <header class="page-header">
      <div><p class="eyebrow">询价台账 / 公司资料中心</p><h1 id="page-title">工作台</h1><p id="page-subtitle" class="muted">供应商经验与历史报价，在团队间复用。</p></div>
      <div class="header-actions"><label class="appearance-control" for="appearance">外观<select id="appearance"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label><button id="refresh-button" class="secondary"><svg class="icon" data-icon="refresh" viewBox="0 0 24 24" aria-hidden="true"><path d="M 20 9 Q 18 3 12 3 Q 3 3 3 12 Q 3 21 12 21 Q 18 21 20 16 M 20 3 L 20 9 L 14 9"/></svg>刷新</button><button id="connection-button" class="secondary">连接管理</button></div>
    </header>
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <main id="main" tabindex="-1"><div class="empty-state">正在连接资料中心…</div></main>
    <noscript>请启用浏览器 JavaScript 后使用管理端。</noscript>
    <footer class="workspace-footer">资料以明确发布为准，个人草稿保留在本地。</footer>
  </div>
  <dialog id="detail-dialog" class="detail-dialog" aria-label="资料详情">
    <div class="dialog-bar"><span class="eyebrow">共享资料 / 详情</span><button id="detail-close" class="quiet" aria-label="关闭详情">关闭<svg class="icon" data-icon="close" viewBox="0 0 24 24" aria-hidden="true"><path d="M 6 6 L 18 18 M 18 6 L 6 18"/></svg></button></div>
    <div id="detail-content"></div>
  </dialog>
  <dialog id="connection-dialog" aria-labelledby="connection-title">
    <form id="connection-form" class="stack">
      <div class="panel-header"><h2 id="connection-title">连接资料中心</h2><button type="button" id="connection-close" class="quiet" aria-label="关闭连接管理"><svg class="icon" data-icon="close" viewBox="0 0 24 24" aria-hidden="true"><path d="M 6 6 L 18 18 M 18 6 L 6 18"/></svg></button></div>
      <p class="muted">使用部署时配置的访问令牌。令牌仅在此页面内存中保留，刷新或断开后需重新输入。</p>
      <label class="field">访问令牌<input id="api-token" type="password" autocomplete="off" spellcheck="false" placeholder="本机未配置令牌时可留空"></label>
      <p id="connection-error" class="error" role="alert" hidden></p>
      <div class="actions"><button type="button" id="disconnect-button" class="secondary">断开并清除页面数据</button><button id="connect-submit" class="primary" type="submit">连接</button></div>
    </form>
  </dialog>
</body>
</html>
