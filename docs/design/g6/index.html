<!doctype html>
<html lang="zh-CN" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据关系 · G6 交互小样</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div><span class="eyebrow">数据中心 / 本体模型</span><h1>对象与关系<span class="badge">G6 小样</span></h1><p>浏览业务对象，沿引用关系理解数据。</p></div><div class="header-actions"><label class="quiet"><input type="checkbox" id="quiet">减少动效</label><button id="theme">切换深色</button></div></header>
<main>
<nav class="catalog" aria-label="对象目录"><div class="catalog-title">对象类型 <span id="type-count"></span></div><div id="catalog"></div></nav>
<section class="workspace" aria-label="交互关系图">
<div class="toolbar"><div class="object-selector"><label for="object">当前对象</label><select id="object"></select></div><label class="search"><span>查找对象</span><input id="search" type="search" placeholder="中文名称或英文标识" autocomplete="off"></label><label class="layout-label">布局<select id="layout"><option value="concentric">关系探索</option><option value="antv-dagre">引用层次</option></select></label><button id="all" aria-pressed="false">全部关系</button></div>
<div id="results" aria-label="搜索结果" hidden></div>
<div class="canvas-wrap"><div id="graph" role="img" aria-label="对象引用关系图，可拖动画布和缩放；对象也可通过旁侧列表选择"></div><div class="canvas-caption"><span id="summary">正在载入模型…</span><span>引用方 → 被引用方</span></div><div class="view-tools"><button id="zoom-out" aria-label="缩小">−</button><span id="zoom">100%</span><button id="zoom-in" aria-label="放大">＋</button><span class="divider"></span><button id="fit">适应画布</button><button id="focus">聚焦选中</button></div><div id="loading" role="status">正在载入本地图引擎…</div></div>
<footer><div id="legend"></div><span>滚轮缩放 · 拖动探索 · 点击查看关系</span></footer>
</section>
<aside aria-label="对象与引用详情"><section id="detail" aria-live="polite"></section><div class="inspector-tabs" role="tablist" aria-label="对象详情视图"><button id="relations-tab" role="tab" aria-selected="true" aria-controls="relations-panel">关系</button><button id="properties-tab" role="tab" aria-selected="false" aria-controls="properties-panel">属性</button></div><section id="relations-panel" role="tabpanel" aria-labelledby="relations-tab"><div class="relation-head"><h2>关联关系</h2><span id="relation-count"></span></div><div id="relations"></div></section><section id="properties-panel" role="tabpanel" aria-labelledby="properties-tab" hidden><div id="properties"></div></section></aside>
</main>
<div class="note"><span>真实 schema · 不含业务记录</span><span>小样验证布局与交互，尚未替换 Flutter 正式视图。</span></div>
<script src="node_modules/@antv/g6/dist/g6.min.js"></script><script type="module" src="app.mjs"></script>
</body></html>
